<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
	<script th:src="@{/angular/language.js}"></script>
</head>
<div id="page-wrapper" data-ng-init="loadApproved()">
	<div class="row">
		<div class="col-md-12">
			<div class="panel panel-info">
				<div class="panel-heading">Approved Applications &nbsp;&raquo;&nbsp; Signed Documents (mapped district)</div>
				<div class="panel-body">

					<div class="row" style="margin-bottom:10px">
						<div class="col-md-6">
							<div class="input-group">
								<input type="text" class="form-control" placeholder="Search by application no / unit name" data-ng-model="searchText"/>
								<span class="input-group-btn">
									<button class="btn btn-default" data-ng-click="loadApproved()">Search</button>
								</span>
							</div>
						</div>
					</div>

					<table class="table table-striped table-bordered table-hover">
						<thead>
							<tr>
								<th width="5%">S.No.</th>
								<th>Application No.</th>
								<th>Unit / Institution</th>
								<th>Application Date</th>
								<th>Status</th>
								<th width="18%">Signed Document</th>
							</tr>
						</thead>
						<tbody>
							<tr data-ng-repeat="app in approvedList">
								<td>{{$index + 1}}</td>
								<td>{{app.applicationId}}</td>
								<td>{{app.unitOrInstName}}</td>
								<td>{{app.applicationDate}}</td>
								<td><span class="label label-success">{{app.status}}</span></td>
								<td align="center">
									<button class="btn btn-info btn-sm" data-ng-click="downloadSigned(app.applicationId)">
										<i class="fa fa-download"></i> Download Signed PDF
									</button>
									&nbsp;|&nbsp;
									<a href="javascript:void(0)" data-ng-click="viewProgress(app)">Progress</a>
								</td>
							</tr>
							<tr data-ng-if="approvedList.length == 0">
								<td colspan="6" class="text-center">No approved applications.</td>
							</tr>
						</tbody>
					</table>

				</div>
			</div>
		</div>
	</div>
</div>
</html>
